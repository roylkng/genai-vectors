[package]
name = "genai-vectors"
version = "0.1.0"
edition = "2021"
authors = ["Rajan Kadeval"]
description = "Experimental S3 Vectors-style vector search service backed by FAISS and object storage"
repository = "https://github.com/roylkng/genai-vectors"
license = "MIT"
readme = "README.md"
keywords = ["vector", "database", "similarity", "search", "ai"]
categories = ["database", "algorithms"]

[[bin]]
name = "genai-vectors"
path = "src/main.rs"

[lib]
name = "genai_vectors"
path = "src/lib.rs"

[dependencies]
faiss = { version = "0.12.1", default-features = false, features = ["static"] }

anyhow = "1.0"
thiserror = "1.0"

axum        = { version = "0.7", features = ["json", "macros"] }
tokio       = { version = "1.38", features = ["rt-multi-thread", "macros"] }

serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"

uuid        = { version = "1", features = ["v4"] }
chrono      = { version = "0.4.31", features = ["serde"] }
clap        = { version = "4.0", features = ["derive"] }
bytes       = "1.6"
regex       = "1.10"
num_cpus    = "1.0"
futures     = "0.3"

tracing     = "0.1"
tracing-subscriber = "0.3"

aws-config  = { version = "1.0", optional = true }
aws-sdk-s3  = { version = "1.0", features = ["behavior-version-latest"], optional = true }

parquet = { version = "56.0.0", features = ["arrow"] }
arrow = { version = "56.0.0", features = ["json"] }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["s3"]
s3 = ["aws-sdk-s3", "aws-config"]
